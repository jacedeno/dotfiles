# Dash to Dock style for every GNOME desktop on these dotfiles (C2-B5, BD-1, ThinkPadT470,
# Santi's laptop), loaded by
# install.sh with `dconf load /org/gnome/shell/extensions/dash-to-dock/`. Only these keys
# are set; everything else stays as the machine has it. Copied 2026-10-24 from Santi's
# laptop, with the apps grid button at the END of the dock (Jose's choice, on both).
# Re-applied on every install.sh / update(): change the dock here, not in its settings.
[/]
dock-position='BOTTOM'
dock-fixed=true
extend-height=false
show-show-apps-button=true
show-apps-at-top=false
show-trash=true
show-mounts=true
running-indicator-style='DOTS'
dash-max-icon-size=48
transparency-mode='FIXED'
custom-background-color=true
background-color='#1e1e2e'
background-opacity=0.85
click-action='focus-or-previews'
intellihide=false
