# GeekForge only. Its shells live under herdr.service (a system unit), so
# there is no login session, no /run/user/$UID and no systemd --user manager.
# Rootless podman defaults to the systemd cgroup manager, warns twice on
# every command and falls back to cgroupfs anyway; this makes that the
# default and moves the event log off journald for the same reason.
[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
