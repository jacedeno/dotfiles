<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Color emoji in Alacritty.
  Fedora ships Noto Color Emoji only as COLRv1, which Alacritty cannot paint, so
  fontconfig fell back to monochrome Symbola. The bitmap (CBDT) build lives in
  ~/.local/share/fonts; hide the COLRv1 build and Symbola so it always wins.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/google-noto-color-emoji-fonts/*</glob>
      <glob>/usr/share/fonts/gdouros-symbola/*</glob>
    </rejectfont>
  </selectfont>
  <alias>
    <family>monospace</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias>
    <family>FiraCode Nerd Font Mono</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
