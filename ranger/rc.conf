# ranger — only the overrides. ranger loads its own default rc.conf first, then this
# file, so anything not listed here keeps the upstream default.
# Linked to ~/.config/ranger/rc.conf by install.sh.

# Show git status next to each file inside a repo (modified, untracked, staged) and
# the last commit message in the status bar. Upstream default is false.
set vcs_aware true
