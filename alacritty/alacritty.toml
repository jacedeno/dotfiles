# ==============================================================================
# ~/.config/alacritty/alacritty.toml — jacedeno dotfiles
# The terminal on every machine (see machines/ThinkPadT470.md for the migration
# off WezTerm). Alacritty has no built-in tabs/panes, so herdr owns splits, tabs
# and session persistence instead. Shell setup lives in zsh/.zshrc, untouched here.
# ==============================================================================

[general]
live_config_reload = true

# Alacritty's default TERM is "alacritty", which older remote hosts don't have
# a terminfo entry for. xterm-256color is universally understood.
[env]
TERM = "xterm-256color"

# Launch herdr instead of a bare shell: herdr attaches to (or starts) the
# persistent session and spawns the login shell (zsh) inside its panes. Bare
# "herdr" resolves via PATH (~/.local/bin, on PATH per zshrc), so this works
# unchanged on every machine — do not hardcode a user-specific absolute path.
# To get a plain zsh without herdr, run: alacritty -e /usr/bin/zsh
[terminal.shell]
program = "herdr"

[font]
size = 12.0

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Regular"

[scrolling]
history = 10000

# --- Colors: Tokyo Night, background overridden to pure black -----------------
[colors.primary]
background = "#000000"
foreground = "#c0caf5"

[colors.cursor]
text = "#1a1b26"
cursor = "#c0caf5"

[colors.selection]
text = "CellForeground"
background = "#283457"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"

# --- Mouse: right-click pastes --------------------------------------------------
[mouse]
bindings = [
  { mouse = "Right", action = "Paste" },
]

# --- Keys: Ctrl+Shift+K = vi mode -----------------------------------------------
# Keyboard-only text selection inside full-screen TUIs (claude, vim, k9s) without
# fighting mouse capture.
[keyboard]
bindings = [
  { key = "K", mods = "Control|Shift", action = "ToggleViMode" },
]
