# ~/.config/environment.d/10-local-bin.conf — jacedeno dotfiles
#
# GNOME Shell (and anything else launched by the systemd --user manager —
# app-gnome-*.scope units, dbus-activated services) does NOT inherit PATH
# from ~/.zshrc. Only interactive login shells source that. Without this
# file, GUI-launched apps only see the base PATH systemd starts with
# (typically /usr/local/bin:/usr/bin, no ~/.local/bin), so anything installed
# there — herdr, oh-my-posh, claude, agy — is invisible to them.
#
# Concretely: this is why Alacritty, launched from the GNOME app grid with
# terminal.shell.program = "herdr" in alacritty.toml, failed with
# "Failed to spawn command 'herdr': No such file or directory" while running
# the exact same alacritty binary from an interactive terminal worked fine
# (diagnosed 2026-08-04 on ThinkPadT470, see machines/ThinkPadT470.md).
#
# Takes effect on next login (systemd-environment-d-generator runs at
# systemd --user manager startup) — not on `daemon-reload`.
PATH=${HOME}/.local/bin:${HOME}/bin:${PATH}
